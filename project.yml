name: Elkunufe

options:
  bundleIdPrefix: com.appzilla
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: es
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Solo Apple silicon: sin versión Intel.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    # Firma ad hoc: sin cuenta de desarrollador de Apple.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  ElkunufeCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/ElkunufeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appzilla.ElkunufeCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  Elkunufe:
    type: application
    platform: macOS
    sources:
      - path: Sources/Elkunufe
    dependencies:
      - target: ElkunufeCore
    info:
      path: Sources/Elkunufe/Info.plist
      properties:
        CFBundleDisplayName: Elkünufe
        CFBundleName: Elkunufe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.puzzle-games
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © 2026 App-Zilla
        CFBundleLocalizations: [es, en]
        CFBundleDevelopmentRegion: es
    entitlements:
      path: Sources/Elkunufe/Elkunufe.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appzilla.Elkunufe
        PRODUCT_NAME: Elkunufe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  ElkunufeCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ElkunufeCoreTests
    dependencies:
      - target: ElkunufeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appzilla.ElkunufeCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Elkunufe:
    build:
      targets:
        Elkunufe: all
        ElkunufeCore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ElkunufeCoreTests
    archive:
      config: Release

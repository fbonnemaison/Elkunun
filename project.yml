name: Elkunun

options:
  bundleIdPrefix: com.appzilla
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: es
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Solo Apple silicon: sin versión Intel.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    # Firma ad hoc: sin cuenta de desarrollador de Apple.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

targets:
  ElkununCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/ElkununCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appzilla.ElkununCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
      configs:
        # El solucionador y el generador son lentos sin optimizar: también en Debug.
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -O

  Elkunun:
    type: application
    platform: macOS
    sources:
      - path: Sources/Elkunun
    dependencies:
      - target: ElkununCore
    info:
      path: Sources/Elkunun/Info.plist
      properties:
        CFBundleDisplayName: Elkünun
        CFBundleName: Elkunun
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.puzzle-games
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © 2026 App-Zilla
        CFBundleLocalizations: [es, en]
        CFBundleDevelopmentRegion: es
    entitlements:
      path: Sources/Elkunun/Elkunun.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appzilla.Elkunun
        PRODUCT_NAME: Elkunun
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  ElkununCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ElkununCoreTests
    dependencies:
      - target: ElkununCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appzilla.ElkununCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Elkunun:
    build:
      targets:
        Elkunun: all
        ElkununCore: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ElkununCoreTests
    archive:
      config: Release
